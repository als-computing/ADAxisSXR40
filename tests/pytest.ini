[pytest]
# Run from the module root or from tests/: `tests/run.sh` sets the environment and
# selects the tier. Test file basenames are unique across folders on purpose (no
# __init__.py in the category folders).
testpaths = static boot pvs driver acquire image files robustness workflow performance compat stress
addopts = -ra --strict-markers -p no:cacheprovider
junit_family = xunit1
markers =
    smoke: fast, read-mostly, no disk writes, no stop/start stress (default tier)
    full: HDF5/TIFF writes, robustness, workflow, performance, compat (needs --full)
    stress: sustained-load tier, minutes long and tens of GB written; only via tests/run.sh stress
    hardware_state: documents the CURRENT state of the camera; a failure means hardware, not driver
    ours_only: only meaningful on ADAxisSXR40; skipped when ADTucsen is serving
    fork_fix: verifies a fix the fork made; expected to FAIL (xfail) when ADTucsen is serving
    compat: comparison against a recorded ADTucsen baseline
